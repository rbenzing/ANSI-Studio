name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  docker:
    name: Docker image starts and passes its health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ansi-studio .
      - run: |
          docker run -d --name app -p 3000:3000 ansi-studio
          for i in $(seq 30); do curl -fsS http://localhost:3000/healthz && exit 0; sleep 1; done
          docker logs app
          exit 1
